# Continuous integration (R-016): on every pull request and every push to main — install, route types, typecheck, lint,
# unit tests (vitest), production build into .next-ci, then the end-to-end scenarios (Playwright, tests/e2e) against
# `next start` on that build with a fresh database. Nothing reaches Vigie, Cursus, Codex or Anthropic: their URLs and
# keys are not set here, so the mock connectors and the local transcript analyser run. A second job builds the deployment
# image (Dockerfile, R-003) and starts it; the dependency audit runs in its own light workflow (audit.yml, R-174).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KEYSTONE_DIST_DIR: .next-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Route types (LayoutProps / PageProps)
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          KEYSTONE_DATA_DIR: ${{ runner.temp }}/keystone-build-data

      - name: Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: End-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # R-003: the deployment image (Dockerfile) builds and starts — PGlite in the container's /data, the demo data set and the
  # demo sign-in (the beta's set-up behind Coolify's basic authentication), no antivirus — and answers /api/health then a
  # page. Nothing is pushed to a registry.
  image:
    name: Container image (build, start, health)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag keystone-pm:ci .

      - name: Start it (PGlite, demo data, demo sign-in)
        run: >-
          docker run --detach --name keystone --publish 127.0.0.1:3080:3000
          --env KEYSTONE_SEED=demo --env KEYSTONE_AUTH=demo --env KEYSTONE_FILE_SCAN=off --env KEYSTONE_JOBS=inprocess
          keystone-pm:ci

      - name: Health 200, then a page 200, as the non-root user
        run: |
          code=000
          for i in $(seq 1 90); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3080/api/health || true)
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200 || { echo "health: $code"; exit 1; }
          page=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3080/)
          test "$page" = 200 || { echo "home page: $page"; exit 1; }
          test "$(docker inspect --format '{{.Config.User}}' keystone-pm:ci)" = node

      - name: Server log
        if: always()
        run: docker logs keystone 2>&1 | tail -n 200
