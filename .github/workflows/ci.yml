# Continuous integration (R-016): on every pull request and every push to main — install, route types, typecheck, lint,
# unit tests (vitest), production build into .next-ci, then the end-to-end scenarios (Playwright, tests/e2e) against
# `next start` on that build with a fresh database. Nothing reaches Vigie, Cursus, Codex or Anthropic: their URLs and
# keys are not set here, so the mock connectors and the local transcript analyser run. A second job builds the deployment
# image (Dockerfile, R-003) and starts it; a third one migrates and checks Keystone on a PostgreSQL 16 shaped like the shared
# EPC2I server; the dependency audit runs in its own light workflow (audit.yml, R-174).
# Actions minutes (owner, 22 Oct 2026: the free plan's monthly quota ran out): a change to documentation only (docs/,
# design/, .artifacts/, Markdown files) runs nothing — except docs/EXPLOITATION.md, which a unit test reads (jobs runbook).
# A push to main (the merge of a pull request that passed everything) runs the fast checks only: install, route types,
# typecheck, lint, unit tests — they catch two merged pull requests that break each other. "Run workflow" (manual) runs all.
name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!design/**'
      - '!.artifacts/**'
      - '!**/*.md'
      - 'docs/EXPLOITATION.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!design/**'
      - '!.artifacts/**'
      - '!**/*.md'
      - 'docs/EXPLOITATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KEYSTONE_DIST_DIR: .next-ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Route types (LayoutProps / PageProps)
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # From here on: pull requests and manual runs only (a push to main stops after the unit tests).
      - name: Build
        if: github.event_name != 'push'
        run: npm run build
        env:
          KEYSTONE_DATA_DIR: ${{ runner.temp }}/keystone-build-data

      - name: Playwright browser
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: github.event_name != 'push'
        run: npm run test:e2e

      - name: End-to-end report
        if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # R-003: the deployment image (Dockerfile) builds and starts — PGlite in the container's /data, the demo data set and the
  # demo sign-in (the beta's set-up behind Coolify's basic authentication), no antivirus — and answers /api/health then a
  # page. Nothing is pushed to a registry.
  image:
    name: Container image (build, start, health)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag keystone-pm:ci .

      # The volume of a deployment made with the PR #1 image, which ran as root: a PGlite database owned by root (Coolify,
      # 18 Oct 2026: "PGlite failed to initialize properly" once the image ran as node). The entrypoint gives it to node.
      - name: A data volume written as root
        run: >-
          docker volume create keystone-data &&
          docker run --rm --user root --entrypoint npm --volume keystone-data:/data --env KEYSTONE_SEED=demo
          keystone-pm:ci run db:migrate

      - name: Start it on that volume (PGlite, demo data, demo sign-in)
        run: >-
          docker run --detach --name keystone --publish 127.0.0.1:3080:3000 --volume keystone-data:/data
          --env KEYSTONE_SEED=demo --env KEYSTONE_AUTH=demo --env KEYSTONE_FILE_SCAN=off --env KEYSTONE_JOBS=inprocess
          keystone-pm:ci

      - name: Health 200, then a page 200, as the non-root user
        run: |
          code=000
          for i in $(seq 1 90); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3080/api/health || true)
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          test "$code" = 200 || { echo "health: $code"; exit 1; }
          page=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3080/)
          test "$page" = 200 || { echo "home page: $page"; exit 1; }
          test "$(docker exec keystone stat -c %U /proc/1)" = node
          test "$(docker exec keystone stat -c %U /data/pg)" = node

      - name: Server log
        if: always()
        run: docker logs keystone 2>&1 | tail -n 200

  # Shared EPC2I server (decision M-01): a PostgreSQL 16 with the base layer of Matrix (vendored in infra/postgres-socle/: the
  # Matrix repository is private), then, as keystone_app (owner of the schema keystone only, no CREATE on the database): two
  # `npm run db:migrate` at the same time (one applies the migrations and seeds, the other waits for the lock and finds nothing
  # to do), scripts/db-check.ts --postgres, and the opt-in PostgreSQL tests (fresh databases created as the superuser).
  postgres:
    name: PostgreSQL 16 (shared server layout)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # pg_dump / pg_restore of the server's major version, as in the worker image (postgresql-client-16): the runner's newer
      # client writes `SET transaction_timeout`, which a PostgreSQL 16 server refuses at restore.
      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get install -y -q postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Base layer (roles, schemas, rights)
        run: |
          for v in KEYSTONE_APP_PASSWORD CODEX_APP_PASSWORD CURSUS_APP_PASSWORD VIGIE_APP_PASSWORD MATRIX_APP_PASSWORD EPC2I_SAUVEGARDE_PASSWORD; do
            p=$(openssl rand -hex 16); echo "$v=$p" >> "$GITHUB_ENV"; export "$v=$p"
          done
          for f in infra/postgres-socle/*.sql; do psql -d postgres -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: Two db:migrate at the same time, as keystone_app
        env:
          KEYSTONE_SEED: demo
        run: |
          export DATABASE_URL="postgres://keystone_app:${KEYSTONE_APP_PASSWORD}@localhost:5432/epc2i"
          npm run db:migrate > migrate-1.log 2>&1 & first=$!
          npm run db:migrate > migrate-2.log 2>&1 & second=$!
          wait $first; wait $second
          cat migrate-1.log migrate-2.log
          test "$(psql -d epc2i -Atc 'select count(*) from keystone.__drizzle_migrations')" = "$(ls drizzle/*.sql | wc -l)"
          test "$(psql -d epc2i -Atc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname in ('public', 'drizzle')")" = 0

      - name: db-check on the server
        run: DATABASE_URL="postgres://keystone_app:${KEYSTONE_APP_PASSWORD}@localhost:5432/epc2i" npx tsx --conditions=react-server scripts/db-check.ts --postgres

      - name: PostgreSQL tests (driver parity, concurrency, backup and restore)
        env:
          KEYSTONE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npx vitest run src/server/db/postgres.integration.test.ts src/server/backup/backup.test.ts
